<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralForge AI Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0f19; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { height: 55px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .logo { font-size: 17px; font-weight: 800; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .export-btn { background: linear-gradient(135deg, #8b5cf6, #d946ef); color: white; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
        
        .preview-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 12px; background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 70%); }
        .canvas { width: 100%; height: 270px; background: rgba(15, 23, 42, 0.6); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.12); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .preview-placeholder { text-align: center; color: #64748b; font-size: 13px; font-weight: 500; }
        .preview-icon { font-size: 32px; margin-bottom: 8px; }
        
        .subtitle-box { position: absolute; bottom: 16px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; text-align: center; max-width: 85%; border: 1px solid rgba(255, 255, 255, 0.2); }

        .panel-container { height: 185px; background: #0f172a; padding: 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px 20px 0 0; }
        .input-box { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; width: 100%; height: 60px; border-radius: 12px; padding: 12px; font-size: 13px; resize: none; outline: none; }
        
        .gen-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 13px; width: 100%; margin-top: 10px; }

        .toolbar { height: 65px; background: #090d16; display: flex; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .tool-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 11px; font-weight: 600; color: #64748b; background: none; border: none; cursor: pointer; }
        .tool-item.active { color: #a855f7; }
        .tool-icon { font-size: 18px; margin-bottom: 3px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .loader { width: 24px; height: 24px; border: 3px solid #38bdf8; border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; margin-bottom: 10px; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">✨ ViralForge Studio</div>
        <button class="export-btn" onclick="exportVideo()">Export 4K</button>
    </div>

    <div class="preview-container">
        <div class="canvas" id="canvas">
            <div id="previewState" class="preview-placeholder">
                <div class="preview-icon">🎬</div>
                <p>Enter prompt below & click generate</p>
            </div>
        </div>
    </div>

    <div class="panel-container">
        <div id="tab-ai_video" class="tab-content active">
            <textarea id="videoPrompt" class="input-box" placeholder="Describe video prompt..."></textarea>
            <button class="gen-btn" onclick="generateVideo()">⚡ Generate AI Video</button>
        </div>

        <div id="tab-ai_voice" class="tab-content">
            <textarea id="voiceScript" class="input-box" placeholder="Write voiceover script..."></textarea>
            <button class="gen-btn" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="generateVoice()">🎙️ Generate AI Voice</button>
        </div>

        <div id="tab-subtitles" class="tab-content">
            <button class="gen-btn" style="margin-top:15px; background: linear-gradient(135deg, #8b5cf6, #6d28d9);" onclick="syncSubtitles()">✨ Auto-Sync Captions</button>
        </div>
    </div>

    <div class="toolbar">
        <button class="tool-item active" onclick="switchTab('ai_video', this)"><span class="tool-icon">🤖</span>AI Video</button>
        <button class="tool-item" onclick="switchTab('ai_voice', this)"><span class="tool-icon">🎙️</span>AI Voice</button>
        <button class="tool-item" onclick="switchTab('subtitles', this)"><span class="tool-icon">💬</span>Subtitles</button>
    </div>

    <script>
        let ELEVENLABS_API_KEY = localStorage.getItem('EL_KEY');
    let REPLICATE_API_TOKEN = localStorage.getItem('REP_KEY');
    const DEFAULT_VOICE_ID = "21m00Tcm4TlvDq8ikWAM";

    function setKeys() {
        const repKey = prompt("Enter Replicate API Token (r8_...):", localStorage.getItem('REP_KEY') || '');
        const elKey = prompt("Enter ElevenLabs API Key:", localStorage.getItem('EL_KEY') || '');
        if(repKey) localStorage.setItem('REP_KEY', repKey.trim());
        if(elKey) localStorage.setItem('EL_KEY', elKey.trim());
        alert('API Keys Saved!');
    }


    // Replicate / ElevenLabs call se pehle key prompt karne ka option
    function checkKeys() {
        if (!localStorage.getItem('REP_KEY')) {
            const userKey = prompt("Enter active Replicate API Token (r8_...):");
            if (userKey) localStorage.setItem('REP_KEY', userKey.trim());
        }
    }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tool-item').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');
        }

        async function generateVideo() {
            const prompt = document.getElementById('videoPrompt').value;
            if(!prompt) return alert('Prompt text likhein!');
            
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = `
                <div class="loader"></div>
                <p style="color:#38bdf8; font-weight:600; font-size:13px;">Requesting AI Model...</p>
            `;

            const proxyUrl = 'https://corsproxy.io/?';
            const targetUrl = 'https://api.replicate.com/v1/predictions';

            try {
                const response = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + REPLICATE_API_TOKEN,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        version: "a42692cdea586c0d0c2711da773885bb34215d31639a04625e7d82b0b4317132",
                        input: { prompt: prompt }
                    })
                });

                const data = await response.json();
                if(data.id) {
                    checkStatus(data.id);
                } else {
                    canvas.innerHTML = '<p style="color:#ef4444; font-size:13px;">❌ API Token Invalid</p>';
                }
            } catch(err) {
                canvas.innerHTML = '<p style="color:#ef4444; font-size:13px;">❌ Connection Error</p>';
            }
        }

        async function checkStatus(predictionId) {
            const canvas = document.getElementById('canvas');
            const proxyUrl = 'https://corsproxy.io/?';
            const targetUrl = 'https://api.replicate.com/v1/predictions/' + predictionId;
            
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
                        headers: { 'Authorization': 'Bearer ' + REPLICATE_API_TOKEN }
                    });
                    const result = await res.json();

                    if (result.status === 'succeeded') {
                        clearInterval(interval);
                        const videoUrl = Array.isArray(result.output) ? result.output[0] : result.output;
                        canvas.innerHTML = `
                            <video src="${videoUrl}" controls autoplay loop style="width:100%; height:100%; border-radius:16px; object-fit:cover;"></video>
                            <div id="subtitleOverlay" class="subtitle-box" style="display:none;"></div>
                        `;
                    } else if (result.status === 'failed') {
                        clearInterval(interval);
                        canvas.innerHTML = '<p style="color:#ef4444; font-size:13px;">❌ Generation Failed</p>';
                    } else {
                        canvas.innerHTML = `
                            <div class="loader"></div>
                            <p style="color:#38bdf8; font-weight:600; font-size:13px;">Rendering Video (${result.status})...</p>
                        `;
                    }
                } catch(e) {
                    clearInterval(interval);
                    canvas.innerHTML = '<p style="color:#ef4444; font-size:13px;">❌ Polling Error</p>';
                }
            }, 3000);
        }

        async function generateVoice() {
            const script = document.getElementById('voiceScript').value;
            if(!script) return alert('Script text likhein!');

            let subtitleOverlay = document.getElementById('subtitleOverlay');
            if(!subtitleOverlay) {
                const canvas = document.getElementById('canvas');
                subtitleOverlay = document.createElement('div');
                subtitleOverlay.id = 'subtitleOverlay';
                subtitleOverlay.className = 'subtitle-box';
                canvas.appendChild(subtitleOverlay);
            }

            subtitleOverlay.innerText = "⏳ Generating Voice...";
            subtitleOverlay.style.display = 'block';

            const proxyUrl = 'https://corsproxy.io/?';
            const targetUrl = 'https://api.elevenlabs.io/v1/text-to-speech/' + DEFAULT_VOICE_ID;

            try {
                const response = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
                    method: 'POST',
                    headers: {
                        'xi-api-key': ELEVENLABS_API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: script,
                        model_id: "eleven_monolingual_v1"
                    })
                });

                if(response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    audio.play();

                    subtitleOverlay.innerText = script;
                } else {
                    subtitleOverlay.innerText = "❌ ElevenLabs Key Error";
                }
            } catch(err) {
                subtitleOverlay.innerText = "❌ Voice Generation Failed";
            }
        }

        function syncSubtitles() { alert('Captions Synced!'); }
        function exportVideo() { alert('Exporting 4K Movie...'); }
    </script>
</body>
</html>
